name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  diversity:
    name: Verify the diversity properties
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build three variants
        run: |
          set -e
          VARIANT_SEED=0xb2e1 python3 divcc src/ -o node_01
          VARIANT_SEED=0x61a7 python3 divcc src/ -o node_02
          VARIANT_SEED=0xb2e1 python3 divcc src/ -o node_01_rebuild

      # Diversity is only useful if it changes nothing observable. A variant
      # that behaves differently is a miscompile, not a mitigation.
      - name: Functional equivalence
        run: |
          set -e
          diff <(./node_01) <(./node_02) \
            || { echo "::error::variants differ in behaviour"; exit 1; }
          echo "variants behave identically"

      # The actual security property: different seed, different layout.
      - name: Layout divergence
        run: |
          set -e
          python3 compare.py node_01 node_02 | tee divergence.txt
          different=$(grep -oE '^[0-9]+' <<< "$(grep 'different addresses' divergence.txt)")
          echo "functions relocated: $different"
          if [ "$different" -lt 5 ]; then
            echo "::error::only $different functions moved; diversification is not working"
            exit 1
          fi

      # A device must be reproducible from its seed, or you cannot rebuild the
      # exact image a given unit is running when you need to debug it.
      - name: Seed determinism
        run: |
          set -e
          python3 compare.py node_01 node_01_rebuild | tee determinism.txt
          different=$(grep -oE '^[0-9]+' <<< "$(grep 'different addresses' determinism.txt)")
          if [ "$different" -ne 0 ]; then
            echo "::error::same seed produced $different relocated functions; builds are not reproducible"
            exit 1
          fi
          echo "same seed reproduces the same layout"

  gadgets:
    name: Gadget survival measurement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM for Nyxstone
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev

      - name: Install dependencies
        env:
          NYXSTONE_LLVM_PREFIX: /usr/lib/llvm-18
        run: pip install -r requirements-gadgets.txt pytest

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Build two variants
        run: |
          VARIANT_SEED=0xb2e1 python3 divcc src/ -o node_01
          VARIANT_SEED=0x61a7 python3 divcc src/ -o node_02

      # This step asserts a weakness, not a strength. Link-order shuffling
      # relocates objects without touching their contents, so every gadget
      # should survive and keep its offset inside its own function. If that
      # ever stops being true, the README's honesty section is out of date.
      - name: Measure and check the documented limitation
        run: |
          set -e
          python3 gadgets.py node_01 node_02
          python3 gadgets.py node_01 node_02 --json > gadgets.json
          cat gadgets.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("gadgets.json"))
          if d["survival_rate"] < 90:
              sys.exit(f"::error::only {d['survival_rate']}% of gadgets survived; "
                       "README claims shuffling destroys none")
          if d["matched_gadgets"] == 0:
              sys.exit("::error::no gadgets could be matched between variants")
          print(f"{d['relocation_rate']}% of matched gadgets relocated")
          print("documented limitation still holds")
          PY

  validate:
    name: Cross-check against ROPgadget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM for Nyxstone
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev

      - name: Install dependencies
        env:
          NYXSTONE_LLVM_PREFIX: /usr/lib/llvm-18
        run: pip install -r requirements-gadgets.txt ROPgadget

      # System binaries: x86-64 ELF, compiled by someone else, not by divcc.
      # This is the only check in the repo that runs against code this project
      # did not produce, and the only one validated by an outside tool.
      - name: Validate on system binaries
        run: |
          python3 gadgets.py --inventory /usr/bin/ls /bin/bash /usr/bin/ssh
          python3 validate_against_ropgadget.py /usr/bin/ls /usr/bin/ssh
